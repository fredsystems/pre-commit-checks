---
name: Lint

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  # =====================================================================
  # Primary Lint job
  # =====================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run flake pre-commit hooks
        run: nix develop -c pre-commit run --all-files

  # =====================================================================
  # Hook-suite buildability gate
  #
  # Proves a PR will not break the exported hook suite for downstream
  # consumers. For every variant `lib.mkCheck` can produce, on both Linux
  # and macOS, the git-hooks run derivation must build: every hook binary
  # has to resolve and the suite has to execute cleanly against this repo.
  # =====================================================================
  hook-suite:
    name: Hook suite (${{ matrix.suite }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        suite:
          - suite-base
          - suite-python
          - suite-rust
          - suite-docker
          - suite-javascript
          - suite-all

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build ${{ matrix.suite }}
        run: nix build ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem).${{ matrix.suite }}" --no-link --print-build-logs

  # =====================================================================
  # Aggregate gate
  #
  # Single required status check that is green only when the lint job and
  # every hook-suite matrix cell succeed. Point branch protection at this
  # job instead of each individual matrix leg.
  # =====================================================================
  lint-summary:
    name: Lint summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - hook-suite

    steps:
      - name: Verify all required jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.hook-suite.result }}" != "success" ]; then
            echo "lint: ${{ needs.lint.result }}"
            echo "hook-suite: ${{ needs.hook-suite.result }}"
            echo "One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs passed."
